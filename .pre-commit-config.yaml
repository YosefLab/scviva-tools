fail_fast: false
default_language_version:
  python: python3
  node: 22.23.1
default_stages:
  - pre-commit
  - pre-push
minimum_pre_commit_version: 2.16.0
repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.13
    hooks:
      - id: biome-format
        exclude: ^\.cruft\.json$ # inconsistent indentation with cruft - file never to be modified manually.
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.29.4
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-ast
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
      - id: check-case-conflict
      - id: check-yaml
      - id: check-merge-conflict
        args: [--assume-in-merge]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--no-progress, --fix]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--skip=docs/tutorials/*.ipynb,docs/superpowers/**", "--ignore-words-list=theis,raison,mor,gord,commun,scarches,coo,ot"]

  - repo: local
    hooks:
      - id: forbid-to-commit
        name: Don't commit rej files
        entry: |
          Cannot commit .rej files. These indicate merge conflicts from automated template updates.
          Fix the conflicts manually and remove the .rej files.
        language: fail
        files: '.*\.rej$'
ci:
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip:
    - biome-format
