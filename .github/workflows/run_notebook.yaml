name: run notebook

on:
  workflow_call:
    inputs:
      notebook:
        description: "Path to the notebook to run"
        required: true
        type: string
      version:
        description: "latest/stable/semver/branch"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  notebook:
    runs-on: [self-hosted, Linux, X64, CUDA]

    timeout-minutes: 600 # lenient timeout for slow tutorials

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"

      - name: Install Python kernel
        run: |
          python -m pip install --upgrade pip wheel
          python -m ipykernel install --user
          python -m pip install -e ".[tutorials,spatial,rapids-cuda13]"
          export CUDACXX=/usr/local/cuda/bin/nvcc
          export CUDA_PATH=/usr/local/cuda

      - name: Run notebook
        working-directory: docs/tutorials
        env:
          NOTEBOOK: ${{ inputs.notebook }}
        run: |
          python -m jupyter nbconvert --execute --inplace "$NOTEBOOK"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: run ${{ inputs.notebook }}
          title: automated update for ${{ inputs.notebook }}
          branch: update-${{ inputs.notebook }}
