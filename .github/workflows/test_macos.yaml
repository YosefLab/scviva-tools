name: Test (macOS)

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, opened]
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HATCH_ENV: hatch-test.py3.13

jobs:
  test:
    # Run only when PR has label "macos tests" or "all tests", or on schedule/manual trigger
    if: >-
      (
        contains(github.event.pull_request.labels.*.name, 'macos tests') ||
        contains(github.event.pull_request.labels.*.name, 'all tests') ||
        (contains(github.event_name, 'schedule') && github.repository == 'YosefLab/scviva-tools') ||
        contains(github.event_name, 'workflow_dispatch')
      )

    runs-on: macos-14

    defaults:
      run:
        shell: bash -e {0}

    name: integration

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"

      - name: Create hatch environment
        run: uvx hatch env create $HATCH_ENV

      - name: List all installed package versions
        run: uvx hatch run $HATCH_ENV:uv pip list

      - name: Run tests using hatch
        env:
          MPLBACKEND: agg
          PLATFORM: macos-14
          DISPLAY: :42
          COLUMNS: 120
        run: uvx hatch run $HATCH_ENV:run-cov -v --color=yes

      - name: Generate coverage report
        run: |
          test -f .coverage || uvx hatch run $HATCH_ENV:cov-combine
          uvx hatch run $HATCH_ENV:cov-report   # report visibly
          uvx hatch run $HATCH_ENV:coverage xml # create report for upload

      - name: Upload coverage
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: macos
