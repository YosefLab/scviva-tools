[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "scviva-tools"
version = "0.1.6"
description = "Consolidated spatial transcriptomics analysis toolkit with variational inference methods"
readme = "README.md"
keywords = [ "deconvolution", "deep learning", "single-cell", "spatial transcriptomics", "variational inference" ]
license = { file = "LICENSE" }
maintainers = [ { name = "Ori Kronfeld", email = "ori.kronfeld@weizmann.ac.il" } ]
authors = [ { name = "Ori Kronfeld", email = "ori.kronfeld@weizmann.ac.il" } ]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Natural Language :: English",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata>=0.11",
  "igraph",
  "joblib",
  "lightning>=2",
  "numpy>=2",
  "pandas>=2",
  "pyro-ppl>=1.8",
  "rich>=12",
  "scanpy[skmisc]>=1.10",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "scvi-tools>=1.4",
  "sparse>=0.14",
  "statsmodels",
  "torch>=2",
  "tqdm>=4.60",
]
optional-dependencies.all = [ "scviva-tools[rapids,spatial,tutorials]" ]
optional-dependencies.cuda = [ "mlx[cuda]", "torchaudio", "torchvision" ]
optional-dependencies.file-sharing = [ "fcswrite", "gdown", "pooch", "readfcs" ]
optional-dependencies.hub = [ "boto3", "dvc[s3]", "huggingface-hub" ]
optional-dependencies.metal = [ "mlx-metal", "torchaudio", "torchvision" ]
optional-dependencies.rapids = [ "cugraph", "cuml", "cupy", "rapids-singlecell[rapids]" ]
optional-dependencies.rapids-cuda12 = [
  "cugraph-cu12>=24",
  "cuml-cu12>=24",
  "cupy-cuda12x",
  "rapids-singlecell-cu12[rapids]",
]
optional-dependencies.rapids-cuda13 = [
  "cugraph-cu13>=24",
  "cuml-cu13>=24",
  "cupy-cuda13x",
  "rapids-singlecell-cu13[rapids]",
]
optional-dependencies.spatial = [
  "geomloss",
  "numba",
  "pooch",
  "pynndescent",
  "seaborn",
  "spatialdata>=0.2",
  "squidpy>=1.4",
  "torch-geometric",
]
optional-dependencies.tpu = [ "torch-xla[tpu]" ]
optional-dependencies.tutorials = [
  "cell2location",
  "jupyter",
  "leidenalg",
  "matplotlib",
  "plotnine",
  "scrublet",
  "scviva-tools[spatial]",
  "seaborn",
  "umap-learn>=0.5",
]
optional-dependencies.vision = [ "biopython>=1.79" ]
urls."Bug Tracker" = "https://github.com/YosefLab/scviva-tools/issues"
urls.Documentation = "https://github.com/YosefLab/scviva-tools"
urls.Source = "https://github.com/YosefLab/scviva-tools"

[dependency-groups]
dev = [ "pre-commit", "twine>=4.0.2" ]
test = [ "coverage", "pytest>=7", "pytest-cov", "pytest-pretty" ]
doc = [
  "ipykernel",
  "ipython",
  "myst-nb",
  "myst-parser",
  "pooch",
  "sphinx<9",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1.0.1",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinxcontrib-bibtex",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/scviva" ]
envs.default.installer = "uv"
envs.default.dependency-groups = [ "dev" ]
envs.docs.scripts.build = "sphinx-build -M html docs docs/_build -W --keep-going {args}"
envs.docs.scripts.clean = "git clean -fdX -- {args:docs}"
envs.docs.scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
envs.docs.dependency-groups = [ "doc" ]
envs.hatch-test.installer = "uv"
envs.hatch-test.features = [ "spatial" ]
envs.hatch-test.matrix = [ { python = [ "3.12", "3.13", "3.14" ] } ]
envs.hatch-test.dependency-groups = [ "dev", "test" ]
envs.test-cuda.template = "hatch-test"
envs.test-cuda.features = [ "cuda", "rapids-cuda13", "spatial" ]
envs.test-metal.template = "hatch-test"
envs.test-metal.features = [ "metal", "spatial" ]

[tool.ruff]
target-version = "py313"
line-length = 99
indent-width = 4
src = [ "src" ]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "docs/tutorials",
  "node_modules",
  "venv",
]
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
format.docstring-code-format = true
lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # pycodestyle errors
  "F",      # Pyflakes
  "FA",     # flake8-future-annotations
  "I",      # isort
  "NPY",    # numpy
  "PT",     # pytest style
  "RUF100",
  "TCH",    # flake8-type-checking
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # pycodestyle warnings
]
lint.ignore = [
  "B008",   # function calls in argument defaults
  "D100",   # missing docstring in public module
  "D104",   # missing docstring in public package
  "D107",   # missing docstring in __init__
  "D213",   # multi-line docstring summary
  "D400",   # first line should end with period
  "D401",   # imperative mood
  "E741",   # ambiguous variable names (I is identity matrix)
  "NPY002", # np.random functions
  "PT011",  # pytest.raises match
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "BLE001", "I" ]
lint.per-file-ignores."src/scviva/__init__.py" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-v --tb=short -p no:randomly"
ini_options.markers = [
  "cuda: mark tests that require CUDA GPU",
  "optional: mark optional tests (usually slower or requiring external resources)",
]
ini_options.xfail_strict = true

[tool.coverage]
run.source = [ "scviva" ]
run.omit = [ "**/test_*.py" ]
